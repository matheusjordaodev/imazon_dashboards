<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImazonGeo - Dashboards</title>

  <!-- Ícones & Fontes -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sb-w: 288px;
      --sb-w-collapsed: 76px;
      --tb-h: 58px;
      --primary-color: #007C4F;
      --secondary-color: #005A3F;
      --accent: #3fe60d;
      --light-text: #ffffff;
      --gap: 16px;
      --ease: .25s cubic-bezier(.4, 0, .2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      font-family: 'Montserrat', sans-serif;
      background: #eef1f0;
      color: #1f2937;
    }

    /* Largura efetiva da sidebar quando recolhida (desktop) */
    body.sidebar-collapsed { --sb-w: var(--sb-w-collapsed); }

    /* ===== Topbar ===== */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--tb-h);
      background: var(--primary-color);
      color: var(--light-text);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      z-index: 1050;
      box-shadow: 0 1px 8px rgba(0, 0, 0, .18);
    }

    .sb-toggle {
      appearance: none;
      border: 0;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      width: 40px; height: 40px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      transition: background var(--ease);
      flex: 0 0 auto;
    }
    .sb-toggle:hover { background: rgba(255, 255, 255, .22); }
    .sb-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .topbar-title {
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: .2px;
      opacity: .92;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-brand {
      font-size: 1.25rem;
      font-weight: 700;
      margin-left: auto;
      letter-spacing: .3px;
    }
    .topbar-brand .b1 { color: #fff; }
    .topbar-brand .b2 { color: var(--accent); }

    /* ===== Sidebar ===== */
    #sidebar {
      width: var(--sb-w);
      position: fixed;
      top: var(--tb-h);
      left: 0;
      height: calc(100vh - var(--tb-h));
      background: linear-gradient(180deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      z-index: 1030;
      transition: width var(--ease), transform var(--ease);
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, .3) transparent;
    }
    #sidebar::-webkit-scrollbar { width: 6px; }
    #sidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .25); border-radius: 3px; }

    .sidebar-header {
      padding: 20px 14px;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(255, 255, 255, .18);
      transition: min-height var(--ease), padding var(--ease);
    }
    .sidebar-logo {
      width: 210px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      transition: opacity var(--ease);
    }
    .sidebar-mark {
      display: none;
      width: 40px; height: 40px;
      object-fit: contain;
    }

    .sidebar-menu { flex: 1 1 auto; padding: 10px 0; }

    .menu-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 18px;
      color: rgba(255, 255, 255, .9);
      text-decoration: none;
      font-size: .95rem;
      font-weight: 500;
      white-space: nowrap;
      border-left: 3px solid transparent;
      transition: background var(--ease), color var(--ease), border-color var(--ease);
    }
    .menu-item i {
      width: 22px;
      text-align: center;
      font-size: 1.05rem;
      flex: 0 0 auto;
    }
    .menu-item:hover { background: rgba(255, 255, 255, .10); color: #fff; }
    .menu-item.active {
      background: rgba(255, 255, 255, .16);
      color: #fff;
      font-weight: 600;
      border-left-color: var(--accent);
    }

    /* ----- Estado recolhido (desktop): só ícones ----- */
    body.sidebar-collapsed .menu-item-text { opacity: 0; width: 0; overflow: hidden; }
    body.sidebar-collapsed .menu-item { justify-content: center; padding: 14px 0; gap: 0; }
    body.sidebar-collapsed .menu-item i { width: auto; font-size: 1.2rem; }
    body.sidebar-collapsed .sidebar-header { min-height: 84px; padding: 14px 6px; }
    body.sidebar-collapsed .sidebar-logo { display: none; }
    body.sidebar-collapsed .sidebar-mark { display: block; }

    /* ===== Conteúdo ===== */
    #content {
      position: relative;
      margin-left: var(--sb-w);
      padding-top: var(--tb-h);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: margin-left var(--ease);
    }

    #iframe-dashboard-container { flex: 1 1 auto; display: block; margin: var(--gap) var(--gap) 0; }

    #dashboard-iframe {
      width: 100%;
      border: 0;
      display: block;
      overflow: hidden;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .08);
    }

    /* ===== Backdrop (mobile) ===== */
    #backdrop {
      position: fixed;
      inset: var(--tb-h) 0 0 0;
      background: rgba(0, 0, 0, .45);
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--ease), visibility var(--ease);
      z-index: 1025;
    }

    /* ===== Footer ===== */
    footer.footer {
      background: linear-gradient(180deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: var(--light-text);
      border-top: 2px solid var(--accent);
      margin-top: var(--gap);
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }
    .footer-logo {
      height: 46px;
      filter: brightness(0) invert(1);
      flex: 0 0 auto;
    }
    .footer-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: right;
      font-size: .82rem;
      line-height: 1.4;
      opacity: .95;
    }
    .footer-links { display: flex; gap: 16px; justify-content: flex-end; flex-wrap: wrap; }
    .footer-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover { text-decoration: underline; }

    /* ===== Responsivo ===== */
    @media (max-width: 768px) {
      #sidebar {
        width: 272px;
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0, 0, 0, .3);
      }
      body.sidebar-open #sidebar { transform: translateX(0); }
      body.sidebar-open #backdrop { opacity: 1; visibility: visible; }
      #content { margin-left: 0 !important; }
      /* No mobile o menu é overlay, nunca "trilha" */
      body.sidebar-collapsed .menu-item-text { opacity: 1; width: auto; }
      body.sidebar-collapsed .menu-item { justify-content: flex-start; padding: 13px 18px; gap: 14px; }
      body.sidebar-collapsed .sidebar-logo { display: block; }
      body.sidebar-collapsed .sidebar-mark { display: none; }
      body.sidebar-collapsed .sidebar-header { min-height: 150px; padding: 20px 14px; }
      .footer-inner { justify-content: center; text-align: center; }
      .footer-text { text-align: center; align-items: center; }
      .footer-links { justify-content: center; }
    }
  </style>
</head>

<body>
  <div id="topbar">
    <button class="sb-toggle" id="sb-toggle" aria-label="Mostrar/ocultar menu" aria-controls="sidebar" aria-expanded="true">
      <i class="fas fa-bars"></i>
    </button>
    <span class="topbar-title" id="topbar-title">Painéis de Monitoramento da Amazônia</span>
    <div class="topbar-brand"><span class="b1">Imazon</span><span class="b2">Geo</span></div>
  </div>

  <nav id="sidebar">
    <div class="sidebar-header">
      <img class="sidebar-logo" src="../../img/imazon.png" alt="ImazonGeo">
      <img class="sidebar-mark" src="../../img/imazon.png" alt="ImazonGeo">
    </div>
    <div class="sidebar-menu">
      <a href="#" class="menu-item iframe-link active" data-src="SAD/SAD.html" data-title="SAD — Sistema de Alerta de Desmatamento" title="SAD">
        <i class="fas fa-triangle-exclamation"></i><span class="menu-item-text">SAD</span>
      </a>
      <a href="#" class="menu-item iframe-link" data-src="AP/AP.html" data-title="Ameaça e Pressão de Desmatamento" title="Ameaça e Pressão">
        <i class="fas fa-fire"></i><span class="menu-item-text">Ameaça e Pressão</span>
      </a>
      <a href="#" class="menu-item iframe-link" data-src="SIMEX/simex.html" data-title="SIMEX — Monitoramento da Exploração Madeireira" title="SIMEX">
        <i class="fas fa-tree"></i><span class="menu-item-text">SIMEX</span>
      </a>
      <a href="#" class="menu-item iframe-link" data-src="FLORESER/index.html" data-title="FloreSer — Vegetação Secundária" title="FloreSer">
        <i class="fas fa-seedling"></i><span class="menu-item-text">FloreSer</span>
      </a>
      <a href="#" class="menu-item iframe-link" data-src="downloads.html" data-title="Downloads" title="Downloads">
        <i class="fas fa-download"></i><span class="menu-item-text">Downloads</span>
      </a>
    </div>
  </nav>

  <div id="backdrop" hidden></div>

  <div id="content">
    <div id="iframe-dashboard-container">
      <iframe id="dashboard-iframe" loading="lazy" src="SAD/SAD.html" scrolling="no" title="Dashboard"></iframe>
    </div>

    <footer class="footer">
      <div class="footer-inner">
        <img class="footer-logo" src="../../img/LOGO WHITE.png" alt="Valor Compartilhado">
        <div class="footer-text">
          <span>© <span id="footer-year">2026</span> Imazon — Instituto do Homem e Meio Ambiente da Amazônia</span>
          <span class="footer-links">
            <a href="https://imazon.org.br" target="_blank" rel="noopener">imazon.org.br</a>
            <a href="https://imazongeo.org.br" target="_blank" rel="noopener">ImazonGeo</a>
          </span>
        </div>
      </div>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const body     = document.body;
      const iframe   = document.getElementById('dashboard-iframe');
      const links    = document.querySelectorAll('.iframe-link');
      const toggle   = document.getElementById('sb-toggle');
      const backdrop = document.getElementById('backdrop');
      const title    = document.getElementById('topbar-title');
      const yearEl   = document.getElementById('footer-year');
      const KEY = 'imazongeo.sidebarCollapsed';

      if (yearEl) yearEl.textContent = new Date().getFullYear();

      const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

      // Restaura preferência (só desktop) de menu recolhido
      try {
        if (!isMobile() && localStorage.getItem(KEY) === '1') body.classList.add('sidebar-collapsed');
      } catch (e) {}
      syncToggleAria();

      function syncToggleAria() {
        const open = isMobile() ? body.classList.contains('sidebar-open')
                                : !body.classList.contains('sidebar-collapsed');
        toggle.setAttribute('aria-expanded', String(open));
      }

      toggle.addEventListener('click', () => {
        if (isMobile()) {
          body.classList.toggle('sidebar-open');
          backdrop.hidden = !body.classList.contains('sidebar-open');
        } else {
          body.classList.toggle('sidebar-collapsed');
          try { localStorage.setItem(KEY, body.classList.contains('sidebar-collapsed') ? '1' : '0'); } catch (e) {}
        }
        syncToggleAria();
      });

      backdrop.addEventListener('click', () => {
        body.classList.remove('sidebar-open');
        backdrop.hidden = true;
        syncToggleAria();
      });

      // Troca de dashboard
      links.forEach(link => {
        link.addEventListener('click', ev => {
          ev.preventDefault();
          links.forEach(l => l.classList.remove('active'));
          link.classList.add('active');
          iframe.src = link.dataset.src;
          if (title && link.dataset.title) title.textContent = link.dataset.title;
          if (isMobile()) { body.classList.remove('sidebar-open'); backdrop.hidden = true; syncToggleAria(); }
        });
      });

      // Ajuste automático da altura do iframe ao conteúdo
      const fitIframeHeight = () => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          if (!doc) return;
          const body = doc.body, html = doc.documentElement;
          iframe.style.height = Math.max(
            body.scrollHeight, body.offsetHeight,
            html.clientHeight, html.scrollHeight, html.offsetHeight
          ) + 'px';
        } catch (e) {}
      };

      iframe.addEventListener('load', () => {
        fitIframeHeight();
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const ro = new ResizeObserver(() => fitIframeHeight());
          ro.observe(doc.documentElement);
        } catch (e) {}
      });

      // Recolher/expandir muda a largura do conteúdo → reajusta o dashboard
      const refit = () => { fitIframeHeight(); setTimeout(fitIframeHeight, 300); };
      document.getElementById('sidebar').addEventListener('transitionend', refit);
      document.getElementById('content').addEventListener('transitionend', refit);
      window.addEventListener('resize', () => {
        if (!isMobile()) { body.classList.remove('sidebar-open'); backdrop.hidden = true; }
        syncToggleAria();
        fitIframeHeight();
      });
    });
  </script>
</body>
</html>
