<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImazonGeo - Dashboards</title>

  <!-- Ícones & Fontes -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =============== VARIÁVEIS ================= */
    :root {
      --sb-w: 290px;          /* largura fixa da sidebar */
      --ft-h: 45px;           /* altura do footer */
      --tb-h: 56px;           /* altura da topbar */
      --primary-color: #007C4F;
      --secondary-color: #005A3F;
      --hover-color: #339080;
      --dark-text: #2c3e50;
      --light-text: #ffffff;

      --logo-bottom-gap: 12px;
    }

    /* ===== Reset / Base ===== */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;max-width:100vw;overflow-x:hidden;
      font-family:'Montserrat',Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
      height:100%;
      background:#f3f3f3;
    }

    /* ===== Topbar ===== */
    #topbar{
      position:fixed;top:0;left:0;right:0;height:var(--tb-h);
      background:var(--primary-color);color:var(--light-text);
      display:flex;align-items:center;
      padding:0 15px;z-index:1050;width:100%;max-width:100vw
    }
    .topbar-brand{
      font-size:1.3rem;font-weight:600;margin-left:auto; /* empurra para a direita */
    }

    /* ===== Sidebar ===== */
    #sidebar{
      width:var(--sb-w);position:fixed;top:var(--tb-h);left:0;
      height:calc(100vh - var(--tb-h));
      background:linear-gradient(180deg,var(--primary-color) 0%,var(--secondary-color) 100%);
      overflow-y:auto;z-index:1030;display:flex;flex-direction:column
    }

    /* ===== Cabeçalho logo ===== */
    .sidebar-header{
      background:var(--primary-color);
      padding:10px 16px;text-align:center;height:240px; /* altura maior p/ logo maior */
      border-bottom:1px solid rgba(255,255,255,.2);
      display:flex;align-items:center;justify-content:center;overflow:hidden;
      margin-bottom:var(--logo-bottom-gap);
    }
    .sidebar-logo{width:200px;height:auto;max-width:100%} /* logo maior */

    /* ===== Menu ===== */
    .sidebar-menu{flex:1 1 auto}
    .menu-item{
      display:flex;align-items:center;justify-content:flex-start; /* puxa para a esquerda */
      padding:12px 14px 12px 16px; /* menos padding à direita, mais à esquerda */
      color:var(--light-text);text-decoration:none;
      font-size:.95rem;font-weight:400;border-bottom:1px solid rgba(255,255,255,.05);
      transition:background .2s ease, padding .2s ease
    }
    .menu-item:hover{background:rgba(255,255,255,.1);padding-left:20px}
    .menu-item.active{background:rgba(255,255,255,.15);font-weight:600}
    .menu-item-text{
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      margin-left:0;text-align:left; /* texto alinhado à esquerda */
    }

    /* ===== Conteúdo ===== */
    #content{
      position:fixed;
      top:var(--tb-h);
      left:var(--sb-w);
      right:0;
      bottom:0;
      padding-bottom:var(--ft-h);
      display:flex;flex-direction:column;
      min-height:0;max-width:calc(100vw - var(--sb-w));
      overflow-x:hidden;
    }

    #iframe-dashboard-container{flex:1 1 auto;display:flex}
    #dashboard-iframe{flex:1 1 100%;border:0;width:100%;height:100%}

    /* ===== Footer ===== */
    footer.footer{
      position:fixed;left:0;right:0;bottom:0;height:var(--ft-h);
      background:var(--primary-color);color:var(--light-text);
      display:flex;align-items:center;justify-content:center
    }

    /* ===== Scrollbar ===== */
    #sidebar::-webkit-scrollbar{width:6px}
    #sidebar::-webkit-scrollbar-track{background:rgba(255,255,255,.1)}
    #sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:3px}
    #sidebar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.5)}
  </style>
</head>
<body>
  <!-- Topbar -->
  <div id="topbar">
    <div class="topbar-brand"><span style="color:#fff">Imazon</span><span style="color:#3fe60d">Geo</span></div>
  </div>

  <!-- Sidebar fixa -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <img src="../../img/imazon.png" alt="ImazonGeo" width="400" height="300">
    </div>

    <div class="sidebar-menu">
      <!-- SAD -->
      <div class="menu-section">
        <a href="#" class="menu-item iframe-link" data-src="SAD/SAD.html">
          <span class="menu-item-text">SAD</span>
        </a>
      </div>

      <!-- Ameaça & Pressão -->
      <div class="menu-section">
        <a href="#" class="menu-item iframe-link" data-src="AP/AP.html">
          <span class="menu-item-text">Ameaça e Pressão</span>
        </a>
      </div>

      <!-- SIMEX -->
      <div class="menu-section">
        <a href="#" class="menu-item iframe-link" data-src="SIMEX/simex.html">
          <span class="menu-item-text">SIMEX</span>
        </a>
      </div>

      <!-- FloreSer -->
      <div class="menu-section">
        <a href="#" class="menu-item iframe-link" data-src="FLORESER/index.html">
          <span class="menu-item-text">FloreSer</span>
        </a>
      </div>

      <!-- Downloads -->
      <div class="menu-section">
        <a href="#" class="menu-item iframe-link" data-src="downloads.html">
          <span class="menu-item-text">Downloads</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo principal fixo -->
  <div id="content">
    <div id="iframe-dashboard-container">
      <iframe id="dashboard-iframe" loading="lazy" src="SAD/SAD.html"></iframe>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p style="margin:0">
      <a href="/" style="color:#fffffe;text-decoration:none">Imazon</a>&nbsp;
      <a rel="license" href="http://creativecommons.org/licenses/by-sa/4.0/">
        <img src="https://i.creativecommons.org/l/by-sa/4.0/80x15.png" alt="Licença CC-BY-SA" style="vertical-align:middle">
      </a>
    </p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const iframe = document.getElementById('dashboard-iframe');
      const links = document.querySelectorAll('.iframe-link');

      /* Seleciona o primeiro item e carrega o respectivo iframe */
      if (links.length) {
        links[0].classList.add('active');
        if (links[0].dataset.src) iframe.src = links[0].dataset.src;
      }

      /* Troca de dashboards via sidebar */
      links.forEach(link => link.addEventListener('click', ev => {
        ev.preventDefault();
        const url = link.dataset.src;
        if (!url) return;
        links.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        iframe.src = url;
      }));
    });
  </script>
</body>
</html>
