    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard SAD - Análise Territorial</title>
        
        <!-- Bibliotecas CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

        <style>
            /* ESTILOS PRINCIPAIS */
            :root {
                --primary-color: #008055;
                --primary-dark: #003300;
                --accent-color: #FF6D00;
                --text-color: #212121;
                --background-color: #F5F5F5;
                --card-color: #FFFFFF;
                --border-radius: 12px;
                --box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            }

            body {
                font-family: 'Montserrat', sans-serif;
                background-color: var(--background-color);
                color: var(--text-color);
                padding: 1.5rem;
            }

            .dashboard-header {
                text-align: center;
                margin-bottom: 2rem;
                background: linear-gradient(135deg, var(--card-color), var(--card-color));
                padding: 2rem;
                border-radius: var(--border-radius);
                box-shadow: var(--box-shadow);
            }

            .card {
                border-radius: var(--border-radius);
                box-shadow: var(--box-shadow);
                border: none;
                height: 100%;
                transition: transform 0.3s ease;
            }

            .card:hover {
                transform: translateY(-5px);
            }

            .card-header {
                background-color: var(--card-color) !important;
                color: var(--primary-dark) !important;
                font-weight: 700 !important;
                border-bottom: 2px solid var(--accent-color) !important;
                padding: 1.25rem;
                font-size: 1.1em;
            }

            .filter-section {
                background: var(--card-color);
                padding: 1.5rem;
                border-radius: var(--border-radius);
                box-shadow: var(--box-shadow);
                margin-bottom: 2rem;
            }

            .form-select, .form-control {
                border-radius: 8px;
                border: 1px solid #ddd;
                transition: all 0.3s ease;
            }

            .form-select:focus, .form-control:focus {
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(0, 128, 85, 0.2);
            }

            #map {
                height: 500px;
                width: 100%;
                border-radius: var(--border-radius);
                box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            }

            .chart-container {
                position: relative;
                height: 450px;
                width: 100%;
            }
            
            .btn-primary {
                background-color: var(--primary-color);
                border-color: var(--primary-color);
                border-radius: 8px;
                font-weight: 600;
                transition: all 0.3s ease;
                padding: 10px 20px;
            }
            
            .btn-primary:hover {
                background-color: var(--primary-dark);
                border-color: var(--primary-dark);
                transform: translateY(-2px);
            }

            /* Filtros específicos */
            .specific-filters {
                background: #f8f9fa;
                padding: 1rem;
                border-radius: 8px;
                margin-top: 1rem;
                border: 1px solid #e9ecef;
            }

            /* Legenda do mapa */
            .heat-legend {
                background: var(--card-color);
                padding: 10px;
                border-radius: 8px;
                box-shadow: var(--box-shadow);
                line-height: 1.4;
                z-index: 1000;
                position: absolute;
                bottom: 20px;
                right: 20px;
                font-size: 0.8rem;
                width: 110px;
            }

            .legend-title {
                font-weight: 600;
                text-align: center;
                margin-bottom: 5px;
                color: var(--primary-dark);
            }

            .legend-gradient {
                height: 150px;
                width: 25px;
                margin: 0 auto;
                border-radius: 3px;
            }

            .legend-labels {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                height: 150px;
                position: absolute;
                left: 40px;
                top: 35px;
                font-size: 0.75rem;
            }

            .info-panel {
                position: absolute;
                top: 20px;
                right: 20px;
                z-index: 1000;
                background: white;
                padding: 15px;
                border-radius: 8px;
                box-shadow: var(--box-shadow);
                font-size: 0.9rem;
                max-width: 300px;
            }

            .stat-card {
                background: var(--primary-color);
                color: white;
                border-radius: 10px;
                padding: 15px;
                margin-bottom: 15px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            }

            .stat-value {
                font-size: 1.8rem;
                font-weight: bold;
                margin: 5px 0;
            }

            .stat-label {
                font-size: 0.9rem;
                opacity: 0.9;
            }

            .data-type-label {
                display: inline-block;
                padding: 5px 12px;
                border-radius: 20px;
                font-weight: 600;
                font-size: 0.85rem;
                margin-left: 10px;
            }

            .desmatamento-label {
                background-color: #e6f7f2;
                color: var(--primary-dark);
            }

            .degradacao-label {
                background-color: #fff3e6;
                color: #e65100;
            }

            /* Responsividade */
            @media (max-width: 768px) {
                body {
                    padding: 1rem;
                }
                
                .dashboard-header {
                    padding: 1.5rem;
                }
                
                #map {
                    height: 350px;
                }
                
                .chart-container {
                    height: 350px;
                }
                
                .heat-legend {
                    bottom: 10px;
                    right: 10px;
                    font-size: 0.7rem;
                    width: 90px;
                }
                
                .info-panel {
                    top: 10px;
                    right: 10px;
                    max-width: 200px;
                    padding: 10px;
                }
            }

            @media (max-width: 576px) {
                .chart-container {
                    height: 300px;
                }
                
                #map {
                    height: 300px;
                }
                
                .stat-card {
                    padding: 10px;
                }
                
                .stat-value {
                    font-size: 1.5rem;
                }
            }
        </style>
    </head>
    <body>

    <div class="container-fluid">
        <div class="dashboard-header fade-in fade-in-1">
        <img src="../../img/sad.png" alt="Logo SAD" style="max-width: 150px; height: auto; display: block; margin: 0 auto;">
        </div>
        
        <!-- Seção de Filtros -->
        <div class="filter-section">
            <div class="row g-3 align-items-end">
                <!-- Filtro Principal: Tipo de Dado -->
                <div class="col-md-3">
                    <label for="dataType" class="form-label fw-bold">1. Escolha o Tipo de Dado:</label>
                    <select id="dataType" class="form-select">
                        <option value="desmatamento">Desmatamento</option>
                        <option value="degradacao">Degradação</option>
                    </select>
                </div>

                <!-- Filtro Principal: Escala Territorial -->
                <div class="col-md-3">
                    <label for="territoryType" class="form-label fw-bold">2. Escolha a Escala Territorial:</label>
                    <select id="territoryType" class="form-select">
                        <option value="estados">Estados</option>
                        <option value="municipios">Municípios</option>
                        <option value="terrasIndigenas">Terras Indígenas</option>
                        <option value="unidadesConservacao">Unidades de Conservação</option>
                        <option value="assentamentos">Assentamentos</option>
                    </select>
                </div>

                <!-- Filtro de Período -->
                <div class="col-md-2">
                    <label for="startPeriod" class="form-label fw-bold">Período Inicial:</label>
                    <input type="month" id="startPeriod" class="form-control" value="2023-01">
                </div>
                <div class="col-md-2">
                    <label for="endPeriod" class="form-label fw-bold">Período Final:</label>
                    <input type="month" id="endPeriod" class="form-control" value="2023-05">
                </div>
                
                <div class="col-md-2 d-grid">
                    <button id="apply-filters" class="btn btn-primary">
                        <i class="fas fa-filter me-2"></i>Aplicar Filtros
                    </button>
                </div>
            </div>
            
            <!-- Filtros Específicos (serão exibidos dinamicamente) -->
            <div id="specific-filters" class="specific-filters" style="display: none;">
                <div class="row g-3" id="specific-filters-content"></div>
            </div>
        </div>

        
        <!-- Painel de Estatísticas -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">Área Total</div>
                    <div class="stat-value" id="total-area">0 km²</div>
                    <div>no período selecionado</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background-color: #e65100;">
                    <div class="stat-label">Área Média Mensal</div>
                    <div class="stat-value" id="avg-area">0 km²</div>
                    <div>em 2024</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background-color: #006064;">
                    <div class="stat-label">Territórios Afetados</div>
                    <div class="stat-value" id="affected-territories">0</div>
                    <div>no período</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background-color: #37474f;">
                    <div class="stat-label">Variação Anual</div>
                    <div class="stat-value" id="annual-change">0%</div>
                    <div>em relação a 2023</div>
                </div>
            </div>
        </div>
        
        <!-- Seção de Gráficos e Mapa -->
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header" id="bar-chart-title">
                        <i class="fas fa-chart-bar me-2"></i>Ranking
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header" id="map-title">
                        <i class="fas fa-map me-2"></i>Mapa
                    </div>
                    <div class="card-body p-2 position-relative">
                        <div id="map"></div>
                        <div id="info-panel" class="info-panel" style="display: none;">
                            <h6 id="selected-territory">Território</h6>
                            <div><strong>Área:</strong> <span id="selected-area">0</span> km²</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Seção de Gráficos Adicionais -->
        <div class="row g-4 mt-2">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header" id="line-chart-title">
                        <i class="fas fa-chart-line me-2"></i>Série Histórica
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="lineChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header" id="yearly-chart-title">
                        <i class="fas fa-chart-area me-2"></i>Série Histórica Anual
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="yearlyChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bibliotecas JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-fetch@3"></script>

    <script>
        const estadoNomes = {
    AC: "Acre",

    AM: "Amazonas",
    AP: "Amapá",
    BA: "Bahia",
    CE: "Ceará",
    DF: "Distrito Federal",
    ES: "Espírito Santo",
    GO: "Goiás",
    MA: "Maranhão",
    MG: "Minas Gerais",

    PA: "Pará",
    PB: "Paraíba",
    PE: "Pernambuco",

    document.addEventListener('DOMContentLoaded', function () {
        // Elementos da UI
        const dataTypeSelect = document.getElementById('dataType');
        const territoryTypeSelect = document.getElementById('territoryType');
        const startPeriodInput = document.getElementById('startPeriod');
        const endPeriodInput = document.getElementById('endPeriod');
        const specificFiltersContainer = document.getElementById('specific-filters');
        const specificFiltersContent = document.getElementById('specific-filters-content');
        const applyFiltersButton = document.getElementById('apply-filters');

        const lineChartTitle = document.getElementById('line-chart-title');
        const yearlyChartTitle = document.getElementById('yearly-chart-title');

        // Elementos de estatísticas
        const totalAreaEl = document.getElementById('total-area');
        const avgAreaEl = document.getElementById('avg-area');
        const affectedTerritoriesEl = document.getElementById('affected-territories');
        const annualChangeEl = document.getElementById('annual-change');

        // Painel de informações
        const infoPanel = document.getElementById('info-panel');
        const selectedTerritoryEl = document.getElementById('selected-territory');
        const selectedAreaEl = document.getElementById('selected-area');
        const selectedStateEl = document.getElementById('selected-state');
        const selectedPercentageEl = document.getElementById('selected-percentage');

        // Instâncias dos Gráficos e Mapa
        let barChart, lineChart, yearlyChart;
        const map = L.map('map').setView([-5, -55], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        let geoJsonLayer;
        let legend;

        // Variáveis para armazenar dados do gráfico e mapa
        let currentTopTerritories = [];
        let territoryBounds = {};

        // Dados reais para assentamentos (desmatamento e degradação)
        const dataSources = {
            desmatamento: {
                assentamentos: { 
                    csv: "/dataset/sad/csv/alertas_sad_desmatamento_08_2008_04_2024_assentamentos.csv",
                    geojson: "/dataset/sad/geojson/AMZ_assentamentos.geojson"
                },
                estados: {
                    csv: "/dataset/sad/csv/alertas_sad_desmatamento_08_2008_04_2024_municipios.csv",
                    geojson: "/dataset/sad/geojson/AMZ_estados.geojson"
                },
                municipios: { 
                    csv: "/dataset/sad/csv/alertas_sad_desmatamento_08_2008_04_2024_municipios.csv",
                    geojson: "/dataset/sad/geojson/AMZ_municipios.geojson"
                },
                terrasIndigenas: {  
                    csv: "/dataset/sad/csv/alertas_sad_desmatamento_08_2008_04_2024_terraIndigena.csv",
                    geojson: "/dataset/sad/geojson/AMZ_terra_indigena.geojson"
                },
                unidadesConservacao: {  
                    csv: "/dataset/sad/csv/alertas_sad_desmatamento_08_2008_04_2024_unidadeConservacao.csv",
                    geojson: "/dataset/sad/geojson/AMZ_unidade_conservacao.geojson"
                }
            },
            degradacao:{
                assentamentos: { 
                    csv: "/dataset/sad/csv/alertas_sad_degradacao_09_2008_04_2024_assentamento.csv",
                    geojson: "/dataset/sad/geojson/AMZ_assentamentos.geojson"
                },
                estados: {
                    csv: "/dataset/sad/csv/alertas_sad_degradacao_09_2008_04_2024_municipio.csv",
                    geojson: "/dataset/sad/geojson/AMZ_estados.geojson"
                },
                municipios: { 
                    csv: "/dataset/sad/csv/alertas_sad_degradacao_09_2008_04_2024_municipio.csv",
                    geojson: "/dataset/sad/geojson/AMZ_municipios.geojson"
                },
                terrasIndigenas: {  
                    csv: "/dataset/sad/csv/alertas_sad_degradacao_09_2008_04_2024_terraIndigena.csv",
                    geojson: "/dataset/sad/geojson/AMZ_terra_indigena.geojson"
                },
                unidadesConservacao: {  
                    csv: "/dataset/sad/csv/alertas_sad_degradacao_09_2008_04_2024_ucs.csv",
                    geojson: "/dataset/sad/geojson/AMZ_unidade_conservacao.geojson"
                }
            }
        };

        // Mapeamento de nomes de colunas para cada tipo de território
        const territoryNameMapping = {
            assentamentos: 'ASSENTAMEN',
            estados: 'ESTADO',
            municipios: 'MUNICIPIO',
            terrasIndigenas: 'TERRA_INDI',
            unidadesConservacao: 'UNID_CONSE'
        };

        // Função para carregar e processar dados
        async function loadData() {
            const dataType = dataTypeSelect.value;
            const territoryType = territoryTypeSelect.value;
            
            // Carrega dados para assentamentos, estados ou municípios com desmatamento
            if ((dataType === 'desmatamento' || dataType === 'degradacao') && 
                (territoryType === 'assentamentos' || 
                territoryType === 'estados' || 
                territoryType === 'municipios' ||
                territoryType === 'terrasIndigenas' ||
                territoryType === 'unidadesConservacao')) {
                try {
                    // Carregar CSV
                    const csvData = await d3.csv(dataSources[dataType][territoryType].csv);
                    // Converter AREAKM2 para número
                    csvData.forEach(d => {
                        d.AREAKM2 = +d.AREAKM2 || 0;
                    });
                    
                    // Carregar GeoJSON
                    const geojsonResponse = await fetch(dataSources[dataType][territoryType].geojson);
                    const geojsonData = await geojsonResponse.json();
                    
                    return { csvData, geojsonData };
                } catch (error) {
                    console.error('Erro ao carregar dados:', error);
                    return { csvData: [], geojsonData: null };
                }
            }
            
            // Para outros tipos, retornar dados vazios
            return { csvData: [], geojsonData: null };
        }

                                <option value="RR">Roraima</option>
                                <option value="TO">Tocantins</option>
                            </select>

                    specificFiltersContainer.style.display = 'block';
                } 
                else if (dataType === 'desmatamento' && territoryType === 'estados') {
        specificFiltersContent.innerHTML = `

                <label for="stateFilterEstados" class="form-label fw-bold">Filtrar por Estado:</label>
                <select id="stateFilterEstados" class="form-select">

                    <option value="AC">Acre</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="PA">Pará</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="TO">Tocantins</option>
                    <option value="RO/AM">RO/AM</option>
                    <option value="RO/AC">RO/AC</option>
                    <option value="AC/AM">AC/AM</option>
                </select>
            </div>`;
        specificFiltersContainer.style.display = 'block';
    }

                else if (territoryType === 'municipios') {
                    specificFiltersContent.innerHTML = `
                        <div class="col-md-4">
                            <label for="stateFilterMunicipios" class="form-label fw-bold">Filtrar por Estado:</label>
                            <select id="stateFilterMunicipios" class="form-select">
                                <option value="all">Todos os Estados</option>
                                <option value="AC">Acre</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="PA">Pará</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="TO">Tocantins</option>
                            </select>
                        </div>`;
                    specificFiltersContainer.style.display = 'block';
                }
                else if (territoryType === 'terrasIndigenas') {
                    specificFiltersContent.innerHTML = `
                        <div class="col-md-4">
                            <label for="stateFilterTerrasIndigenas" class="form-label fw-bold">Filtrar por Estado:</label>
                            <select id="stateFilterTerrasIndigenas" class="form-select">
                                <option value="all">Todos os Estados</option>
                                <option value="AC">Acre</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="PA">Pará</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="TO">Tocantins</option>
                            </select>
                        </div>`;
                    specificFiltersContainer.style.display = 'block';
                }
                else if (territoryType === 'unidadesConservacao') {
                    specificFiltersContent.innerHTML = `
                        <div class="col-md-3">
                            <label for="stateFilterUC" class="form-label fw-bold">Filtrar por Estado:</label>
                            <select id="stateFilterUC" class="form-select">
                                <option value="all">Todos os Estados</option>
                                <option value="AC">Acre</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="PA">Pará</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="TO">Tocantins</option>
                            </select>

        async function updateDashboard() {
            const { csvData, geojsonData } = await loadData();
            if (!csvData.length || !geojsonData) return;

            const territoryType = territoryTypeSelect.value;
            const nameKey = territoryNameMapping[territoryType];
            
            // Lógica de filtragem de período
            const currentYear = new Date().getFullYear();
            const startYear = 2008;
            const allPeriodData = csvData.filter(d => {
                return d.ANO >= startYear && d.ANO <= currentYear-1;
            });

            const start = new Date(startPeriodInput.value + '-01');
            const end = new Date(endPeriodInput.value + '-01');

            let filteredData = csvData.filter(d => {
                const date = new Date(`${d.ANO}-${String(d.MES).padStart(2, '0')}-01`);
                return date >= start && date <= end;
            });

            // Aplicar filtros específicos
            filteredData = applySpecificFilters(filteredData, territoryType);

            // Agregação de dados
            const aggregatedData = {};
            filteredData.forEach(d => {
                const name = d[nameKey];
                const area = parseFloat(d.AREAKM2) || 0;
                if (name) {
                    aggregatedData[name] = (aggregatedData[name] || 0) + area;
                }
            });

            const sortedData = Object.entries(aggregatedData)
                .sort(([, a], [, b]) => b - a)
                .slice(0, 10); // Top 15

            const labels = sortedData.map(([name]) => {
    if (territoryType === 'estados' && estadoNomes[name]) {
        return estadoNomes[name];
    }
    return name;
});

            const dataValues = sortedData.map(([, area]) => area);

            // Armazenar territórios visíveis
            currentTopTerritories = sortedData.map(([sigla]) => sigla);

            // Atualizar estatísticas
            updateStatistics(aggregatedData, filteredData, territoryType);

            updateBarChart(labels, dataValues);
            updateLineChart(allPeriodData, territoryType);
            updateYearlyChart(allPeriodData);
            updateMap(geojsonData, aggregatedData, territoryType);
            updateTitles();
        }

        // Atualizar estatísticas
        function updateStatistics(aggregatedData, filteredData, territoryType) {
            // Área total
            const totalArea = Object.values(aggregatedData).reduce((sum, area) => sum + area, 0);
            totalAreaEl.textContent = totalArea.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' km²';
            
            // Área média mensal em 2024
            const currentYearData = filteredData.filter(d => d.ANO === 2024);
            const monthsCount = new Set(currentYearData.map(d => d.MES)).size;
            const avgArea = monthsCount > 0 ? 
                currentYearData.reduce((sum, d) => sum + d.AREAKM2, 0) / monthsCount : 0;
            avgAreaEl.textContent = avgArea.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' km²';
            
            // Territórios afetados
            const affectedTerritories = Object.keys(aggregatedData).length;
            affectedTerritoriesEl.textContent = affectedTerritories;
            
            // Variação anual (simulado)
            const variation = Math.round((Math.random() * 20) - 10);
            annualChangeEl.textContent = (variation > 0 ? '+' : '') + variation + '%';
            annualChangeEl.style.color = variation > 0 ? '#ff5252' : '#4caf50';
        }

        // Função para atualizar o mapa
        function updateMap(geojsonData, aggregatedData, territoryType) {
            if (geoJsonLayer) {
                map.removeLayer(geoJsonLayer);
            }
            
            // Remover legenda anterior se existir
            if (legend) {
                legend.remove();
            }

            const nameKey = territoryNameMapping[territoryType];
            const values = Object.values(aggregatedData).filter(v => v > 0);
            const maxVal = values.length ? Math.max(...values) : 1;
            
            // Criar escala de cores
            const dataType = dataTypeSelect.value;
            const colorScale = d3.scaleSequential()
                .domain([0, maxVal])
                .interpolator(dataType === 'desmatamento' ? d3.interpolateReds : d3.interpolateOranges);


            // Filtrar apenas os territórios que estão no top 15
            const filteredGeojson = {
                ...geojsonData,
                features: geojsonData.features.filter(feature => {
                    const name = feature.properties[nameKey];
                    return currentTopTerritories.includes(feature.properties[nameKey]);

                })
            };

            // Resetar bounds
            territoryBounds = {};

            geoJsonLayer = L.geoJSON(filteredGeojson, {
                style: feature => {
                    const name = feature.properties[nameKey];
                    const value = aggregatedData[name] || 0;
                    return {
                        fillColor: colorScale(value),
                        weight: 1.2,
                        opacity: 1,
                        color: '#555',
                        fillOpacity: 0.75,
                        dashArray: territoryType === 'estados' || territoryType === 'municipios' ? '' : '3',
                    };
                },
                onEachFeature: (feature, layer) => {
                    const name = feature.properties[nameKey];
                    const value = aggregatedData[name] || 0;
                    const state = feature.properties.ESTADO || feature.properties.ESTADO1 || 'Não disponível';
                    const percentage = maxVal > 0 ? (value / maxVal * 100).toFixed(2) : 0;
                    
                    // Armazenar bounding box para zoom
                    territoryBounds[name] = layer.getBounds();
                    
                    // Popup com informações detalhadas
                    const popupContent = `
                        <div style="font-family: 'Montserrat', sans-serif; min-width: 200px;">
                            <h6 style="margin: 0 0 8px 0; color: #008055; font-weight: bold;">${name || 'Nome não disponível'}</h6>
                            <p style="margin: 0; font-size: 14px;">
                                <strong>Área:</strong> ${value.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} km²
                            </p>
                        </div>
                    `;
                    
                    layer.bindPopup(popupContent);
                    
                    // Eventos de hover
                    layer.on({
        mouseover: function(e) {
            const layer = e.target;
            layer.setStyle({
                weight: 3,
                color: '#000',
                dashArray: '',
                fillOpacity: 0.9
            });
            if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                layer.bringToFront();
            }

            // Exibe popup ao passar o mouse
            layer.openPopup();

            selectedTerritoryEl.textContent = name || 'Território';
            selectedAreaEl.textContent = value.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
            selectedStateEl.textContent = state;
            selectedPercentageEl.textContent = percentage;
            infoPanel.style.display = 'block';
        },

        mouseout: function(e) {
            geoJsonLayer.resetStyle(e.target);
            infoPanel.style.display = 'none';
        },
        click: function(e) {
            map.fitBounds(e.target.getBounds(), {
                padding: [50, 50],
                animate: true,
                duration: 1.5
            });
            e.target.openPopup(); // <-- aqui está a linha que exibe o popup ao clicar
        }
    });

                        
                    
                }
            }).addTo(map);

            // Adicionar legenda do mapa

            const fraseArtigo = dataTypeFrase[dataKey].artigo;
const preposicao = dataTypeFrase[dataKey].preposicao;

lineChartTitle.innerHTML = `<i class="fas fa-chart-line me-2"></i>Série histórica ${fraseArtigo} ${dataKey} ${preposicao} ${nome} (2008 - 2024)`;
yearlyChartTitle.innerHTML = `<i class="fas fa-chart-area me-2"></i>Série histórica anual ${fraseArtigo} ${dataKey} ${preposicao} ${nome} (2008 - 2024)`;

            
            // Atualizar indicador de tipo de dado
            if (dataTypeIndicator) {
                dataTypeIndicator.textContent = dataType;
                dataTypeIndicator.className = 'data-type-label ' + 
                    (dataTypeSelect.value === 'desmatamento' ? 'desmatamento-label' : 'degradacao-label');
            }
        }

        // Event Listeners
        territoryTypeSelect.addEventListener('change', updateSpecificFilters);
        dataTypeSelect.addEventListener('change', function() {
            updateSpecificFilters();
            updateDashboard();
        });
        applyFiltersButton.addEventListener('click', updateDashboard);

        // Inicialização
        updateSpecificFilters();
        updateDashboard();
        
        // Configurar valores de período padrão
        // Travar período para 2024
startPeriodInput.value = '2024-01';
endPeriodInput.value = '2024-12';

// Também desabilita a edição dos inputs
startPeriodInput.setAttribute('readonly', true);
endPeriodInput.setAttribute('readonly', true);

        
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${year}-${month}`;
        }
    });
    </script>
