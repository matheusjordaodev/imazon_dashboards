<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Downloads — SAD | Ameaça & Pressão | SIMEX | FLORESER</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root{ --brand:#008055; --brand-700:#066644; --brand-200:#D6EFE6; }
  *{box-sizing:border-box}
  body{font-family:'Montserrat',sans-serif;background:#F5F5F5;color:#212121;padding:20px;line-height:1.55}
  .wrap{max-width:1100px;margin:0 auto;padding:6px}

  h2{font-size:1.6rem;text-align:center;margin:10px 0 22px;color:#2d2d2d}
  h2:after{content:"";display:block;width:120px;height:3px;background:var(--brand);margin:10px auto 0;border-radius:3px}

  .tabbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--brand);border-radius:8px;padding:14px;margin:10px 0 22px}
  .tabbar .tab{color:#fff;font-weight:600;background:rgba(255,255,255,.14);padding:10px 14px;border-radius:999px;cursor:pointer;user-select:none;border:1px solid rgba(255,255,255,.25)}
  .tabbar .tab.active{background:#fff;color:var(--brand);border-color:#fff}

  h3{margin:0;color:var(--brand);font-size:1.08rem}
  .card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;margin:18px 0;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.04);position:relative}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}

  .collapse-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:#fff;color:var(--brand);cursor:pointer;transition:all .18s ease;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .collapse-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
  .collapse-btn i{font-size:15px;transition:transform .25s ease}
  .card.collapsed .collapse-btn i::before{content:"\f065";font-family:"Font Awesome 6 Free";font-weight:900}
  .collapse-btn.ghost{background:rgba(255,255,255,.9);border:1px solid rgba(0,128,85,.18);backdrop-filter:saturate(140%) blur(6px)}
  .collapse-btn:focus-visible{outline:2px solid color-mix(in oklab,var(--brand) 60%,white 40%);outline-offset:2px}

  details{border:1px solid #e8e8e8;border-radius:12px;margin:16px 0;background:#fff;position:relative}
  summary{cursor:pointer;list-style:none;padding:16px 20px;font-weight:700;position:relative;z-index:2}
  summary::-webkit-details-marker{display:none}
  .year{font-weight:700}

  /* UM cartão por linha (igual ao print) */
  .format-wrap{display:block;padding:0 20px 14px}
  .format-card{border:1px dashed #e3e3e3;border-radius:12px;padding:10px 14px;background:#fafafa;margin-bottom:10px}
  .format-title{font-size:.9rem;color:#2a2a2a;margin:0 0 6px;font-weight:700}

  .chiplist{display:flex;flex-wrap:wrap;gap:10px;padding:12px 0 4px;margin:0;list-style:none}
  .chiplink{display:inline-block;padding:8px 12px;border:1px solid #e0e0e0;border-radius:999px;background:#fff;font-size:.9rem;color:var(--brand);text-decoration:none;cursor:pointer}
  .chiplink:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chiplink.disabled{color:#999;border-color:#e5e5e5;background:#f6f6f6;cursor:not-allowed;pointer-events:none}
  .chiplink i{margin-right:6px}

  .muted{color:#777}
  .list-divider{list-style:none;padding:8px 24px 16px;margin:0}
  .list-divider > li{padding:10px 0;border-bottom:1px solid #eee}
  .list-divider > li:last-child{border-bottom:none}

  #content{position:relative;isolation:isolate}
  details{position:relative;overflow:visible}
  details[open] > summary ~ *{position:relative;z-index:3}
  a.chiplink,button.chiplink,.btn-mini,.collapse-btn{position:relative;z-index:10000 !important;pointer-events:auto !important}
</style>
</head>
<body>
<div class="wrap">
  <h2>Downloads</h2>

  <div class="tabbar" id="tabbar">
    <div class="tab active" data-ds="sad"><strong>SAD</strong></div>
    <div class="tab" data-ds="ap"><strong>Ameaça e Pressão</strong></div>
    <div class="tab" data-ds="simex"><strong>SIMEX</strong></div>
    <div class="tab" data-ds="floreser"><strong>FLORESER</strong></div>
  </div>

  <div id="content">
    <div class="card" data-section="sad">
      <div class="card-head">
        <h3>Sistema de Alerta de Desmatamento (SAD)</h3>
        <button class="collapse-btn ghost" title="Recolher/Expandir" aria-expanded="true">
          <i class="fa-solid fa-compress" aria-hidden="true"></i>
        </button>
      </div>
      <ul id="sad-list" class="list-divider"><li class="muted">Carregando anos...</li></ul>
    </div>

    <div class="card" data-section="ap" style="display:none">
      <div class="card-head">
        <h3>Ameaça & Pressão</h3>
        <button class="collapse-btn ghost" title="Recolher/Expandir" aria-expanded="true">
          <i class="fa-solid fa-compress" aria-hidden="true"></i>
        </button>
      </div>
      <ul id="ap-list" class="list-divider"><li class="muted">Carregando anos...</li></ul>
    </div>

    <div class="card" data-section="simex" style="display:none">
      <div class="card-head">
        <h3>SIMEX</h3>
        <button class="collapse-btn ghost" title="Recolher/Expandir" aria-expanded="true">
          <i class="fa-solid fa-compress" aria-hidden="true"></i>
        </button>
      </div>
      <ul id="simex-list" class="list-divider"><li class="muted">Carregando anos...</li></ul>
    </div>

    <div class="card" data-section="floreser" style="display:none">
      <div class="card-head">
        <h3>FLORESER</h3>
        <button class="collapse-btn ghost" title="Recolher/Expandir" aria-expanded="true">
          <i class="fa-solid fa-compress" aria-hidden="true"></i>
        </button>
      </div>
      <ul id="floreser-list" class="list-divider"><li class="muted">Carregando anos...</li></ul>
    </div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
/* === Fontes === */
const CFG = {
  SAD:{csv:'/dataset/sad/csv/sad_completo_anual.csv',yearFieldCandidates:['ANO','ano','year','Ano']},
  AP:{csv:'/dataset/ap/csv/ap_completo_anual.csv',yearFieldCandidates:['ANO','ano','year','Ano']},
  SIMEX:{csv:'/dataset/simex/csv/simex_completo_anual.csv',yearFieldCandidates:['ANO','ano','year','Ano']},
  FLORESER:{csv:'/dataset/floreser-9-22-1-ages-sf.csv',yearFieldCandidates:['year','ANO','ano','Ano','ano_ref','ANO_REF']}
};

/* === Ranges garantidos na UI === */
const YEAR_RANGE = {
  SAD:[2004,2025],
  AP:[2020,2023],
  SIMEX:[2007,2023]
  // FLORESER: só CSV dinâmico
};

/* === Catálogo GeoJSON (SAD/AP). SIMEX vazio para mock === */
const CATALOG = {
  SAD:{ 
    2004:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2004.geojson'},
    2005:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2005.geojson'},
    2006:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2006.geojson'},
    2007:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2007.geojson'},
    2008:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2008.geojson'},
    2009:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2009.geojson'},
    2010:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2010.geojson'},
    2011:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2011.geojson'},
    2012:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2012.geojson'},
    2013:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2013.geojson'},
    2014:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2014.geojson'},
    2015:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2015.geojson'},
    2016:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2016.geojson'},
    2017:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2017.geojson'},
    2018:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2018.geojson'},
    2019:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2019.geojson'},
    2020:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2020.geojson'},
    2021:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2021.geojson'},
    2022:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2022.geojson'},
    2023:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2023.geojson'},
    2024:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2024.geojson'},
    2025:{ geojson:'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/sad/geojson/todos/sad_final_2025.geojson'}
  },
  AP:{   
    2020: {geojson: 'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/ameaca_e_pressao/ameaca_e_pressao_2020.geojson'},
    2021: {geojson: 'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/ameaca_e_pressao/ameaca_e_pressao_2021.geojson'},
    2022: {geojson: 'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/ameaca_e_pressao/ameaca_e_pressao_2022.geojson'},
    2023: {geojson: 'https://imazongeo3-web.s3.sa-east-1.amazonaws.com/geojson/ameaca_e_pressao/ameaca_e_pressao_2023.geojson'} },
  SIMEX:{}
};

/* Utils */
const onlyDigitsKeepMinus=s=>String(s==null?'':s).replace(/[^0-9-]/g,'');
function parseYearFlexible(row,candidates){
  for(const k of candidates){ if(row[k]!=null&&row[k]!==''){ const v=parseInt(onlyDigitsKeepMinus(row[k]),10); if(Number.isFinite(v)) return v; } }
  return null;
}
function rowsToCSVWith(rows,sep,newline){
  if(!rows||!rows.length) return '';
  const cols=Object.keys(rows[0]);
  const esc=v=>('"'+String(v==null?'':v).replace(/"/g,'""')+'"');
  const out=[cols.join(sep)];
  rows.forEach(r=>out.push(cols.map(k=>esc(r[k])).join(sep)));
  return out.join(newline)+newline;
}
function downloadBlob(strOrBlob,mime,filename){
  let blob; const isCsv=/csv/i.test(mime)||/\.csv$/i.test(filename);
  if(strOrBlob instanceof Blob){ blob=strOrBlob; }
  else{
    const bom=isCsv?'\ufeff':'';
    const type=isCsv?(mime.includes('charset')?mime:(mime+';charset=utf-8')):mime;
    blob=new Blob([bom,strOrBlob],{type});
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function yearsFromRange([a,b]){const ys=[]; for(let y=b;y>=a;y--) ys.push(y); return ys;}
function computeYears(sec, extraYearsSet=new Set()){
  const base = YEAR_RANGE[sec] ? new Set(yearsFromRange(YEAR_RANGE[sec])) : new Set();
  const catYears = new Set(Object.keys(CATALOG[sec]||{}).map(x=>parseInt(x,10)).filter(Number.isFinite));
  const all = new Set([...base, ...catYears, ...extraYearsSet]);
  return [...all].sort((a,b)=>b-a);
}

/* Helpers de UI para chips mock e reais */
function makeMockChip(label){
  const li=document.createElement('li');
  const a=document.createElement('a');
  a.className='chiplink';
  a.textContent=label;
  a.href="#";
  a.addEventListener('click',(ev)=>{ ev.preventDefault(); ev.stopPropagation(); });
  li.appendChild(a);
  return li;
}
function makeRealChip(label, url){
  const li=document.createElement('li');
  const a=document.createElement('a');
  a.className='chiplink';
  a.textContent=label;
  a.href=url; a.target='_blank'; a.rel='noopener';
  li.appendChild(a);
  return li;
}
function monthsPT(){
  return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
}
function quartersPT(){
  return ['Q1 (Jan–Mar)','Q2 (Abr–Jun)','Q3 (Jul–Set)','Q4 (Out–Dez)'];
}

/* === Seção ===
   - FLORESER: CSV dinâmico (igual).
   - SIMEX: mock (sem links).
   - AP: GeoJSON anual (real se existir) + Trimestral .
   - SAD: GeoJSON anual (real se existir) + Mensal .
*/
function buildSection(sec){
  const ul=document.getElementById(sec.toLowerCase()+'-list');
  ul.innerHTML='';

  const isFloreser = (sec === 'FLORESER');
  const isSimex    = (sec === 'SIMEX');
  const isAP       = (sec === 'AP');
  const isSAD      = (sec === 'SAD');
  const csvUrl=CFG[sec]?.csv;

  if(isFloreser){
    if(!csvUrl){ ul.innerHTML='<li class="muted">Sem fonte CSV configurada.</li>'; return; }
    d3.csv(csvUrl).then(rows=>{
      rows.forEach(r=>{ r.__ANO = parseYearFlexible(r, CFG[sec].yearFieldCandidates); });
      const byYear=new Map();
      rows.forEach(r=>{ if(!Number.isFinite(r.__ANO)) return; if(!byYear.has(r.__ANO)) byYear.set(r.__ANO,[]); byYear.get(r.__ANO).push(r); });
      const years=[...byYear.keys()].sort((a,b)=>b-a);
      ul.innerHTML='';
      if(!years.length){ ul.innerHTML='<li class="muted">Sem dados disponíveis.</li>'; return; }

      years.forEach(y=>{
        const details=document.createElement('details');
        if(y===years[0]) details.open=true;
        const summary=document.createElement('summary'); summary.innerHTML=`<span class="year">${y}</span>`;
        details.appendChild(summary);

        const formats=document.createElement('div'); formats.className='format-wrap';

        // CSV anual
        const fCSV=document.createElement('div'); fCSV.className='format-card';
        fCSV.innerHTML='<div class="format-title">CSV</div>';
        const list=document.createElement('ul'); list.className='chiplist';
        const li=document.createElement('li'); const btn=document.createElement('button');
        btn.type='button'; btn.className='chiplink'; btn.innerHTML='Ano '+y;
        btn.onclick=()=>downloadBlob(rowsToCSVWith(byYear.get(y),',','\r\n'),'text/csv',`${sec.toLowerCase()}_${y}.csv`);
        li.appendChild(btn); list.appendChild(li); fCSV.appendChild(list);
        formats.appendChild(fCSV);

        details.appendChild(formats); ul.appendChild(details);
      });
    }).catch(()=>{ ul.innerHTML='<li class="muted">Não foi possível carregar o CSV do FLORESER.</li>'; });
    return;
  }

  // SAD/AP/SIMEX: estrutura por ano
  const baseYears = computeYears(sec);
  if(!baseYears.length){ ul.innerHTML='<li class="muted">Sem anos configurados.</li>'; return; }

  baseYears.forEach(y=>{
    const details=document.createElement('details');
    if(y===baseYears[0]) details.open=true;
    const summary=document.createElement('summary'); summary.innerHTML=`<span class="year">${y}</span>`;
    details.appendChild(summary);

    const formats=document.createElement('div'); formats.className='format-wrap';

    // Bloco GeoJSON anual (real se houver link)
    const fGJ=document.createElement('div'); fGJ.className='format-card';
    fGJ.innerHTML='<div class="format-title">GeoJSON — anual</div>';
    const gjList=document.createElement('ul'); gjList.className='chiplist';
    const url = (CATALOG[sec]||{})[y]?.geojson;
    if(url && String(url).trim()){
      gjList.appendChild(makeRealChip('Ano '+y, url));
    } else if(isSimex){
      gjList.appendChild(makeMockChip('Ano '+y));
    } else {
      const li=document.createElement('li');
      const a=document.createElement('a');
      a.className='chiplink disabled'; a.textContent='Ano '+y+' (em breve)';
      a.setAttribute('aria-disabled','true');
      li.appendChild(a);
      gjList.appendChild(li);
    }
    fGJ.appendChild(gjList);
    formats.appendChild(fGJ);

    // Bloco extra conforme dataset
    if(isSAD){
      // Mensal 
      const fMensal=document.createElement('div'); fMensal.className='format-card';
      fMensal.innerHTML='<div class="format-title">Mensal </div>';
      const mList=document.createElement('ul'); mList.className='chiplist';
      monthsPT().forEach((m,i)=>{
        mList.appendChild(makeMockChip(`${m}/${y}`));
      });
      fMensal.appendChild(mList);
      formats.appendChild(fMensal);
    }

    if(isAP){
      // Trimestral 
      const fTrim=document.createElement('div'); fTrim.className='format-card';
      fTrim.innerHTML='<div class="format-title">Trimestral </div>';
      const qList=document.createElement('ul'); qList.className='chiplist';
      quartersPT().forEach((q,idx)=>{
        qList.appendChild(makeMockChip(`${q} ${y}`));
      });
      fTrim.appendChild(qList);
      formats.appendChild(fTrim);
    }

    details.appendChild(formats); ul.appendChild(details);
  });
}

/* === Colapso e abas === */
document.getElementById('content').addEventListener('click',e=>{
  const btn=e.target.closest('.collapse-btn'); if(!btn)return;
  const card=btn.closest('.card');
  const collapsed=card.classList.toggle('collapsed');
  btn.setAttribute('aria-expanded',String(!collapsed));
  card.querySelectorAll(':scope > ul.list-divider').forEach(el=>{el.style.display=collapsed?'none':'';});
});

function showSection(ds){
  document.querySelectorAll('.tabbar .tab').forEach(t=>t.classList.toggle('active',t.dataset.ds===ds));
  document.querySelectorAll('[data-section]').forEach(s=>s.style.display=(s.getAttribute('data-section')===ds)?'block':'none');
  buildSection(ds.toUpperCase());
}
document.getElementById('tabbar').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t)return;
  showSection(t.dataset.ds);
});
showSection('sad');
</script>
</body>
</html>
